name: Build MobileGL Plugin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build plugin APK
        working-directory: android-plugin
        env:
          ORG_GRADLE_PROJECT_mobilegl.prebuiltLibsDir: ${{ github.workspace }}/prebuilt
          ORG_GRADLE_PROJECT_mobilegl.sfpew: 'true'
        run: gradle --no-daemon :app:assembleMagmaPluginDebug

      - name: Collect artifact
        run: |
          cp android-plugin/app/build/outputs/apk/magmaPlugin/debug/MobileGL-MagmaPlugin-debug.apk \
             MobileGL-SFPEW-MagmaPlugin-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MobileGL-SFPEW-MagmaPlugin-debug
          path: MobileGL-SFPEW-MagmaPlugin-debug.apk
